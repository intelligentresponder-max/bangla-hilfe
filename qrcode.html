<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR-Code – BanglaHilfe Deutschland</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 12px 48px rgba(0,0,0,.4);
    }
    .stripe-black { background: #000; height: 16px; }
    .stripe-red   { background: #CC0000; height: 16px; }
    .stripe-gold  { background: #FFCE00; height: 16px; }
    .body {
      padding: 2rem;
      text-align: center;
    }
    .flags { font-size: 2.5rem; margin-bottom: .8rem; }
    h1 { font-size: 1.3rem; color: #1a1a1a; margin-bottom: .3rem; }
    .sub { color: #666; font-size: .85rem; margin-bottom: 1.5rem; }
    #qrcode {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    #qrcode canvas, #qrcode img {
      border: 6px solid #FFCE00;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(204,0,0,.2);
    }
    .url {
      background: #f5f5f5;
      border-radius: 8px;
      padding: .6rem 1rem;
      font-size: .78rem;
      color: #333;
      word-break: break-all;
      margin-bottom: 1rem;
    }
    .hint { font-size: .78rem; color: #999; }
  </style>
</head>
<body>
  <div class="card">
    <div class="stripe-black"></div>
    <div class="stripe-red"></div>
    <div class="stripe-gold"></div>
    <div class="body">
      <div class="flags">🇧🇩 🤝 🇩🇪</div>
      <h1>BanglaHilfe Deutschland</h1>
      <p class="sub">Scanne mich – আমাকে স্ক্যান করো</p>
      <div id="qrcode"></div>
      <div class="url">intelligentresponder-max.github.io/bangla-hilfe</div>
      <p class="hint">📱 Kamera draufhalten – fertig!</p>
    </div>
    <div class="stripe-gold"></div>
    <div class="stripe-red"></div>
    <div class="stripe-black"></div>
  </div>

  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://intelligentresponder-max.github.io/bangla-hilfe",
      width: 220,
      height: 220,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
