<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex">
  <title>QR-Code – BanglaHilfe Deutschland</title>
  <link rel="canonical" href="https://intelligentresponder-max.github.io/bangla-hilfe/qrcode.html"/>
  <meta name="description" content="QR-Code zur BanglaHilfe Deutschland Startseite.">
  <link rel="stylesheet" href="assets/css/theme.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": ["Organization", "LocalBusiness"],
  "name": "BanglaHilfe Deutschland",
  "logo": "https://intelligentresponder-max.github.io/bangla-hilfe/images/logo-badge.jpg",
  "url": "https://intelligentresponder-max.github.io/bangla-hilfe/",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Frankfurt am Main",
    "addressCountry": "DE"
  },
  "areaServed": ["DE", "BD"],
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "customer service",
    "url": "https://wa.me/491634692255",
    "availableLanguage": ["German", "Bengali"]
  }
}
</script>
</head>
<body class="qrcode-page">
  <div class="card">
    <div class="stripe-black"></div>
    <div class="stripe-red"></div>
    <div class="stripe-gold"></div>
    <div class="body-inner">
      <div class="flags">🇧🇩 🤝 🇩🇪</div>
      <h1>BanglaHilfe Deutschland</h1>
      <p class="sub">Scanne mich – আমাকে স্ক্যান করো</p>
      <div id="qrcode"></div>
      <div class="url">intelligentresponder-max.github.io/bangla-hilfe</div>
      <p class="hint">📱 Kamera draufhalten – fertig!</p>
    </div>
    <div class="stripe-gold"></div>
    <div class="stripe-red"></div>
    <div class="stripe-black"></div>
  </div>

  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://intelligentresponder-max.github.io/bangla-hilfe",
      width: 220,
      height: 220,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
